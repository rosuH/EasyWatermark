name: Publish Release to Play Store

# CI-P2 attempt 2: Play production upload binds to the **exact** published release.
# - Trigger: release published only (not latest-release polling).
# - Assets: download only github.event.release.tag_name via `gh release download`.
# - Normalization is idempotent: copies into a distinct upload/ dir (never cp self).
# - Job uses the `release` GitHub Environment; upload action pinned to full commit SHA.

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvm.options="-Xmx2560m" -Dkotlin.incremental=false

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: play-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-play-production:
    name: Upload AAB for ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - name: Download and normalize assets for the triggering release only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "ERROR: github.event.release.tag_name is empty" >&2
            exit 1
          fi
          echo "Downloading assets for exact release tag: ${RELEASE_TAG}"
          rm -rf release-download play-upload
          mkdir -p release-download play-upload

          # Exact tag only — never "latest" (avoids racing concurrent publishes).
          gh release download "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --dir release-download \
            --clobber
          echo "Downloaded assets:"
          ls -la release-download

          mapfile -t aabs < <(find release-download -type f -name '*.aab' | sort)
          if [[ ${#aabs[@]} -eq 0 ]]; then
            echo "ERROR: no .aab asset on release ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ ${#aabs[@]} -gt 1 ]]; then
            echo "ERROR: expected exactly one .aab on release ${RELEASE_TAG}, found:" >&2
            printf '  %s\n' "${aabs[@]}" >&2
            exit 1
          fi
          aab="${aabs[0]}"
          echo "AAB_SRC=$aab"

          mapping=""
          mapfile -t maps < <(find release-download -type f -name 'mapping.txt' | sort)
          if [[ ${#maps[@]} -eq 1 ]]; then
            mapping="${maps[0]}"
          elif [[ ${#maps[@]} -gt 1 ]]; then
            echo "ERROR: multiple mapping.txt assets on release ${RELEASE_TAG}" >&2
            printf '  %s\n' "${maps[@]}" >&2
            exit 1
          fi
          if [[ -z "$mapping" || ! -f "$mapping" ]]; then
            echo "ERROR: mapping.txt not found on release ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "MAPPING_SRC=$mapping"

          # Always materialize into a *distinct* upload directory so source==dest never occurs.
          cp -f "$aab" play-upload/app-release.aab
          cp -f "$mapping" play-upload/mapping.txt
          ls -la play-upload/app-release.aab play-upload/mapping.txt
          test -s play-upload/app-release.aab
          test -s play-upload/mapping.txt

      - name: Upload Android Release to Play Store (production)
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: me.rosuh.easywatermark
          releaseFiles: play-upload/app-release.aab
          track: production
          mappingFile: play-upload/mapping.txt
