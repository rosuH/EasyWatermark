name: Desktop packaging

# S4d-166 / J3 (issue 13 §J3): smallest Desktop CI packaging gate.
# Proves: headless run + UNSIGNED `createDistributable` on Ubuntu Zulu 17.
#
# Honesty (do not overclaim):
# - This is **not** a signed three-OS release matrix.
# - No macOS/Windows runners, no notarization, no Authenticode, no DMG/MSI package* proof here.
# - WebP is not advertised unless ImageIO can decode (DesktopImageFormats / J3).
# - App-data uses OS-native roots with legacy ~/.easywatermark copy-forward (DesktopAppPaths).
# Zulu 17 satisfies Compose Desktop vendor guard (Homebrew OpenJDK does not — CMP#3107).

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvm.options="-Xmx2560m" -Dkotlin.incremental=false

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - master
    paths:
      - 'desktopApp/**'
      - 'shared/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/desktop_packaging.yml'

jobs:
  package:
    name: Desktop run + unsigned app image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          gradle-home-cache-cleanup: true
      # Cheap witness first: the shared engine + Desktop entry run headlessly (same gate every Desktop slice uses).
      - name: Desktop headless run witness
        run: ./gradlew :desktopApp:run --args='--headless'
      # Unsigned Desktop app image (Linux app image + bundled JRE via jpackage). App-image mode needs only the
      # JDK — no installer/system packages, no signing.
      - name: Build unsigned Desktop app image (createDistributable)
        run: ./gradlew :desktopApp:createDistributable
