# J2 — Android nightly API matrix skeleton (issue 13 §J2 / plan 53).
#
# Intent: keep multi-API coverage honest without an unbounded emulator farm on free CI.
# Cells API 23 / 29 / 34 / 36 are documented below. Default coverage is unit/Robolectric +
# assembleDebug smoke. Instrumented multi-API + physical-device witnesses are RUNTIME_PENDING
# (see evidence/j2/). Do not invent H3 hard latency SLOs here.
name: Android Nightly Matrix

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvm.options="-Xmx2560m" -Dkotlin.incremental=false

on:
  schedule:
    # 06:00 UTC daily — owner may pause if minutes are tight
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-nightly-matrix
  cancel-in-progress: true

jobs:
  # Single full unit + compile smoke (not 4× redundant suite).
  unit-smoke:
    name: Nightly unit + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          gradle-home-cache-cleanup: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: J2 backup policy structural check
        run: |
          set -euo pipefail
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' app/src/main/AndroidManifest.xml
          grep -q 'android:fullBackupContent="@xml/backup_rules"' app/src/main/AndroidManifest.xml
          test -f app/src/main/res/xml/data_extraction_rules.xml
          test -f app/src/main/res/xml/backup_rules.xml
          echo "backup policy OK"

      - name: assembleDebug + testDebugUnitTest
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --max-workers=4

  # Matrix documents the API targets; does not boot emulators (RUNTIME_PENDING instrumented).
  api-matrix-labels:
    name: API ${{ matrix.api }} matrix label
    runs-on: ubuntu-latest
    needs: unit-smoke
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '23'
            coverage: unit-robolectric-shim / RUNTIME_PENDING instrumented
          - api: '29'
            coverage: unit-robolectric-shim / RUNTIME_PENDING instrumented
          - api: '34'
            coverage: unit-robolectric-shim / RUNTIME_PENDING instrumented
          - api: '36'
            coverage: unit-robolectric-shim / RUNTIME_PENDING instrumented
    steps:
      - name: Document J2 cell
        run: |
          echo "J2 nightly cell API=${{ matrix.api }}"
          echo "coverage=${{ matrix.coverage }}"
          echo "Flows (picker/EXIF/save/process-death/resize): RUNTIME_PENDING instrumented residual"
          echo "Physical device witness: residual (release lane)"
