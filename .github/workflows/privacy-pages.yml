# Publishes docs/ewm-site/ to GitHub Pages.
# Do not point Pages at the whole /docs tree — that would ship research HTML.
#
# Public URLs:
#   http://ewm.rosuh.me/              landing
#   http://ewm.rosuh.me/zh-CN.html
#   http://ewm.rosuh.me/privacy/      Connect privacy URL
#   http://ewm.rosuh.me/privacy/zh-CN.html

name: EWM site

on:
  push:
    branches: [master]
    paths:
      - "docs/ewm-site/**"
      - ".github/workflows/privacy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/ewm-site
      - id: deployment
        uses: actions/deploy-pages@v4
