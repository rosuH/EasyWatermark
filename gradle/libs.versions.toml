[versions]
# Pin to stable AGP for Android Studio compatibility (Studio max supported: 9.2.1).
# Do not use AGP 9.3+/9.4 alphas unless Studio is upgraded past that floor.
agp = "9.2.1"
# S4d-360: Kotlin 2.4.0 + KSP 2.3.10 — highest Maven-published KSP for this Kotlin line.
# Official metadata (repo1.maven.org, symbol-processing-gradle-plugin): latest/release = 2.3.10
# (lastUpdated 20260709). Hard rule: do NOT pair Kotlin 2.4.20-Beta1 with a KSP that only
# targets 2.4.0; no KSP for 2.4.20-Beta1 is published. See build/s4d360-compatibility.md.
kotlin = "2.4.0"
ksp = "2.3.10"
koin-bom = "4.2.2"
toolsGradle = "7.4.2"
ktlintGradle = "11.3.1"
androidxActivity = "1.13.0"
androidxConstraintLayoutCompose = "1.1.1"
androidxNavigationCompose = "2.10.0-alpha06"
kotlinxSerialization = "1.11.0"
coroutines = "1.11.0"
lifecycle = "2.11.0"
lifecycleViewModel = "2.11.0"
coreKtx = "1.19.0"
appcompat = "1.8.0-alpha01"
material = "1.14.0"
room = "2.8.4"
# S4d-142/S4d-231: androidx.sqlite — off-Android BundledSQLiteDriver only (desktop/iOS).
# Absolute latest published: 2.7.0. Android stays framework SupportSQLite compatibility mode.
sqlite = "2.7.0"
datastorePreference = "1.3.0-alpha09"
exifInterface = "1.4.2"
compressor = "3.0.1"
# Android-only custom color dialog (production parity; Compose ColorOption edge).
colorpicker = "2.3.0"
benchmark = "1.5.0-alpha07"
profileinstaller = "1.4.1"
junit = "4.13.2"
espressoCore = "3.7.0"
uiautomator = "2.4.0"
extJunit = "1.3.0"
robolectric = "4.16.1"
# Absolute latest Compose BOM (Google Maven). BOM governs compose UI/foundation/etc.
# Material3 explicit pin may skew BOM — owner absolute-latest policy.
androidxComposeBom = "2026.06.01"
# Absolute latest CMP plugin (Maven Central), non-SNAPSHOT.
composeMultiplatform = "1.12.0-beta01"
accompanist = "0.37.3"
# C3 Tier-2a (S4d-38): Coil 3 (io.coil-kt.coil3, package coil3). Compose-only; no network artifact
# (all image models are local Uris); coil-svg dropped (SvgDecoder was never registered).
coil = "3.5.0"
material3 = "1.5.0-alpha23"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
# S4d-360: official Android-KMP library plugin (replaces com.android.library on :shared).
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
#hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
#hilt-plugin = { id = "dagger.hilt.android.plugin", version.ref = "hilt" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# C4.3: Compose Multiplatform plugin — applied to :shared only (delivers multiplatform Compose incl. iOS).
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# S4d-91: Room Gradle plugin (KMP schema/codegen) — applied to :shared only for the Room KMP
# toolchain proof. Reuses the existing room version. :app keeps classic KSP Android Room.
androidx-room = { id = "androidx.room", version.ref = "room" }



[libraries]
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp = { module = "com.google.devtools.ksp:symbol-processing", version.ref = "ksp" }
# S4d-361: use official alpha BOM so Material3 pre-release (catalog material3) is not forced to stable 1.4.0.
# Alias name + call sites unchanged; artifact is compose-bom-alpha (Google Maven latest matching 2026.06.01).
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom-alpha", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material3-windowSizeClass = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-compose-ui-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigationCompose" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-constraintlayout-compose = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "androidxConstraintLayoutCompose" }
#androidx-motionlayoout-compose = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "androidxConstraintLayoutCompose" }



coil-kt-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }

kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-coroutine-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-coroutine-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
# ADR-0017: Desktop ViewModel.viewModelScope Main dispatcher
kotlin-coroutine-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewModel" }
# ADR-0017 / Phase 0: multiplatform ViewModel for :shared commonMain session host.
# Official KMP artifact (AndroidX); version aligned with app lifecycle line.
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# S4d-142/S4d-231: bundled SQLite driver for Room off-Android (BundledSQLiteDriver). Ships host/native
# SQLite bits; declared only in `:shared` desktop/iOS target source sets so it never reaches `:app`
# (Android stays in Room compatibility mode with the framework SupportSQLite open-helper).
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastorePreference" }
datastore-preference = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreference" }
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifInterface" }

#hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
#hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
#hilt-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
#hilt-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
compressor = { group = "id.zelory", name = "compressor", version.ref = "compressor" }
colorpicker = { group = "com.github.skydoves", name = "colorpickerview", version.ref = "colorpicker" }
benchmark = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
test-junit = { group = "junit", name = "junit", version.ref = "junit" }
test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "extJunit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
