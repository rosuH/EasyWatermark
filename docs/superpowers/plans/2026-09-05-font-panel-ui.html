<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23262611'/%3E%3Cpath d='M7 24 14 7h4l7 17h-4l-2-5h-6l-2 5H7Zm7-8h4l-2-5-2 5Z' fill='%23ffde32'/%3E%3C/svg%3E">
  <title>EasyWatermark 字体面板原型</title>
  <style>
    :root { --bg:#262611; --panel:#303019; --line:#5b5936; --text:#fcfefd; --muted:#bcbba5; --brand:#ffde32; --selected:#45451f; --error:#ffb4a9; --scrim:rgba(8,8,6,.74); }
    * { box-sizing:border-box; } body { margin:0; color:var(--text); background:var(--bg); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; } button { font:inherit; color:inherit; border:0; cursor:pointer; } button:focus-visible { outline:3px solid var(--brand); outline-offset:3px; }
    .review { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:12px 16px; background:#111108; color:var(--muted); font-size:13px; }.review b{color:var(--brand)}.review button{padding:6px 10px;border:1px solid var(--line);border-radius:2px;background:#34341d}.review button.active{border-color:var(--brand);color:var(--brand)}.note{width:100%;margin:0;color:var(--muted);font-size:12px}
    .screens{display:grid;grid-template-columns:minmax(300px,390px) minmax(460px,1fr);gap:28px;max-width:1100px;margin:0 auto;padding:28px 18px}.surface{position:relative;height:clamp(520px,72svh,720px);overflow:hidden;border:1px solid #070704;background:linear-gradient(145deg,#4a4a31,#1c1c0f)}.mobile{border-radius:10px}.surface-label{position:absolute;z-index:1;top:12px;left:14px;color:#eeecd4;font-size:12px}.editor{height:100%;padding:44px 22px 20px;opacity:.78}.editor h2{margin:0 0 14px;font-size:18px}.photo{display:grid;place-items:center;height:calc(100% - 42px);min-height:220px;border:1px solid #88856a;background:linear-gradient(135deg,#77765b,#29291c 55%,#77765b)}.photo-inner{width:80%;min-height:130px;display:grid;place-items:center;border:1px solid #c9c5a4;text-align:center}.watermark{color:#ffdb36;font-size:22px;text-shadow:0 1px 2px #000;transform:rotate(-18deg);transition:font-family .15s ease}.scrim{position:absolute;inset:0;background:var(--scrim);pointer-events:auto}
    .panel-host{position:absolute;z-index:2;display:flex;min-height:0;background:var(--panel);box-shadow:0 -16px 45px #0008}.mobile .panel-host{left:0;right:0;bottom:0;height:min(620px,83%)}.wide .panel-host{width:min(560px,calc(100% - 40px));height:min(620px,83%);left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 12px 45px #0008}.panel-host.closed{display:none}.panel{display:flex;flex:1;flex-direction:column;min-height:0}.head,.default-wrap,.tabs,.footer{flex:0 0 auto}.head{display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 18px;border-bottom:1px solid var(--line)}.head h1{margin:0;font-size:19px}.close{padding:3px 8px;background:none;color:var(--muted);font-size:24px}.default-wrap{padding:12px 18px 8px}.default{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 11px;border:1px solid var(--line);border-radius:2px;background:#292914;text-align:left}.default[aria-pressed="true"]{border-color:var(--brand);background:var(--selected)}.default strong,.row-name{display:block;font-weight:650}.sub{display:block;color:var(--muted);font-size:12px}.check{color:var(--brand);font-size:18px}
    .tabs{display:flex;margin:0 18px 8px;padding:3px;background:#1f1f10}.tabs button{flex:1;padding:8px;background:transparent;color:var(--muted)}.tabs button[aria-pressed="true"]{color:var(--brand);background:var(--selected);font-weight:700}.list{flex:1 1 auto;min-height:0;overflow:auto;padding:0 18px}.row{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr) 24px;gap:10px;align-items:center;padding:9px 8px;border-bottom:1px solid #48472d;background:transparent;text-align:left}.row:hover,.row[aria-pressed="true"]{background:var(--selected)}.glyph{display:grid;place-items:center;width:30px;height:30px;background:#e9e2d0;color:#262611;font-size:16px}.font-sample{display:block;margin-top:1px;color:#dedcc5;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty,.loading,.error{padding:28px 8px;color:var(--muted);text-align:center}.error{margin:8px 0;padding:8px;border-left:3px solid var(--error);color:var(--error);text-align:left;font-size:13px}
    .footer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;min-height:72px;padding:10px 18px;border-top:1px solid var(--line)}.footer-status{grid-column:1 / -1;color:var(--muted);font-size:12px;min-height:17px}.import{padding:9px 0;background:transparent;color:var(--brand);text-align:left;text-decoration:underline}.finish{padding:10px 18px;border-radius:2px;background:var(--brand);color:#262611;font-weight:700}
    @media(max-width:900px){.screens{grid-template-columns:1fr;max-width:430px;padding:16px}.wide .editor{padding:44px 22px 20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <nav class="review" aria-label="原型状态控制"><b>评审控件（不属于产品界面）</b><button class="active" data-state="ready">正常</button><button data-state="loading">系统列表加载中</button><button data-state="partial">部分导入成功</button><button data-state="empty">已导入为空</button><button data-state="error">导入失败</button><button data-reopen>重新打开两种面板</button><p class="note">这是静态交互示意：字体、导入和照片水印均为模拟，不读取系统字体或目录，也不替代应用/设备验收。</p></nav>
  <main class="screens">
    <section class="surface mobile" aria-label="窄屏：编辑器与字体底部面板对照"><span class="surface-label">窄屏：底部面板</span><div class="editor"><h2>编辑水印</h2><div class="photo"><div class="photo-inner"><span class="watermark">EasyWatermark</span></div></div></div><div class="scrim" data-scrim aria-hidden="true"></div><div class="panel-host" data-host></div></section>
    <section class="surface wide" aria-label="宽屏：编辑器与字体居中对话框对照"><span class="surface-label">宽屏：居中对话框</span><div class="editor"><h2>编辑水印</h2><div class="photo"><div class="photo-inner"><span class="watermark">EasyWatermark</span></div></div></div><div class="scrim" data-scrim aria-hidden="true"></div><div class="panel-host" data-host></div></section>
  </main>
  <template id="panel-template"><section class="panel" aria-label="字体选择"><header class="head"><h1>字体</h1><button class="close" aria-label="关闭字体面板">×</button></header><div class="default-wrap"><button class="default" data-default aria-pressed="true"><span><strong>系统默认</strong><span class="sub">Default · 当前设备</span></span><span class="check" aria-hidden="true">✓</span></button></div><div class="tabs" role="group" aria-label="字体来源"><button data-tab="system" aria-pressed="true">系统</button><button data-tab="imported" aria-pressed="false">已导入</button></div><div class="list" data-list aria-live="polite"></div><footer class="footer"><span class="footer-status" data-status>选择后立即应用；完成只关闭面板</span><button class="import" data-import>从文件夹导入</button><button class="finish" data-finish>完成</button></footer></section></template>
  <script>
    (() => {
      const fonts={system:[{name:"系统无衬线（示例）",meta:"系统字体 · 普通",family:"Arial, sans-serif"},{name:"系统衬线（示例）",meta:"系统字体 · 普通",family:"Georgia, serif"},{name:"系统等宽（示例）",meta:"系统字体 · 普通",family:"ui-monospace, SFMono-Regular, monospace"}],imported:[{name:"阅读体（示例）",meta:"已导入 · 常规",family:"Georgia, serif"},{name:"标注等宽（示例）",meta:"已导入 · 常规",family:"ui-monospace, SFMono-Regular, monospace"}]};
      const sampleText="EasyWatermark", hosts=[...document.querySelectorAll("[data-host]")], escapeHtml=v=>String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); let tab="system",state="ready",selected={name:"系统默认",family:"sans-serif"};
      const template=document.getElementById("panel-template"); hosts.forEach(host=>host.append(template.content.cloneNode(true)));
      document.querySelectorAll("[data-state]").forEach(button=>button.addEventListener("click",()=>{state=button.dataset.state;if(state==="loading")tab="system";if(state==="partial"||state==="empty")tab="imported";render()}));
      document.querySelector("[data-reopen]").addEventListener("click",()=>hosts.forEach(host=>{host.classList.remove("closed");host.closest(".surface").querySelector("[data-scrim]").hidden=false}));
      document.querySelectorAll(".close,[data-finish]").forEach(button=>button.addEventListener("click",event=>{const host=event.currentTarget.closest("[data-host]");host.classList.add("closed");host.closest(".surface").querySelector("[data-scrim]").hidden=true}));
      document.querySelectorAll("[data-default]").forEach(button=>button.addEventListener("click",()=>{selected={name:"系统默认",family:"sans-serif"};render()}));
      document.querySelectorAll("[data-tab]").forEach(button=>button.addEventListener("click",()=>{tab=button.dataset.tab;render()}));
      document.querySelectorAll("[data-import]").forEach(button=>button.addEventListener("click",()=>{state="partial";tab="imported";render()}));
      function renderRows(){const rows=fonts[tab];if(state==="loading"&&tab==="system")return '<p class="loading">正在加载系统字体…</p>';if(state==="empty"&&tab==="imported")return '<p class="empty"><strong>还没有导入字体</strong><br>可使用底部“从文件夹导入”。</p>';const error=state==="error"?'<p class="error">导入失败：无法读取所选文件夹。已有字体与当前选择未改变。</p>':"";return error+rows.map(font=>{const on=selected.name===font.name;return `<button class="row" data-font="${escapeHtml(font.name)}" data-family="${escapeHtml(font.family)}" aria-pressed="${on}"><span class="glyph" aria-hidden="true">Aa</span><span><span class="row-name">${escapeHtml(font.name)}</span><span class="sub">${escapeHtml(font.meta)}</span><span class="font-sample" style="font-family:${escapeHtml(font.family)}">${sampleText}</span></span><span class="check" aria-hidden="true">${on?"✓":""}</span></button>`}).join("")}
      function render(){document.querySelectorAll("[data-state]").forEach(button=>button.classList.toggle("active",button.dataset.state===state));document.querySelectorAll("[data-host]").forEach(host=>{const fallback=host.querySelector("[data-default]"),on=selected.name==="系统默认";fallback.setAttribute("aria-pressed",String(on));fallback.querySelector(".check").textContent=on?"✓":"";host.querySelectorAll("[data-tab]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.tab===tab)));host.querySelector("[data-list]").innerHTML=renderRows();host.querySelectorAll("[data-font]").forEach(button=>button.addEventListener("click",()=>{selected={name:button.dataset.font,family:button.dataset.family};state="ready";render()}));host.querySelector("[data-status]").textContent=state==="partial"?"新增 2 个，重复 1 个，失败 1 个；未自动选择新字体。":state==="loading"&&tab==="system"?"系统列表加载中；系统默认和导入仍可用。":"选择后立即应用；完成只关闭面板"});document.querySelectorAll(".watermark").forEach(mark=>{mark.textContent=sampleText;mark.style.fontFamily=selected.family})}
      render();
    })();
  </script>
</body>
</html>
