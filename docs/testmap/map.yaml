# EasyWatermark e2e map — single source of truth (historical ADR-0032 test-map contract;
# current docs/adr/0032 is splash fade — see historical-adr-0032-e2e-test-map-and-harness.md).
# Artemis Android agent payloads live in docs/testing/artemis-cases.json, bound 1:1 by edge id.
# That file is execution material, not a second topology. Drive labels below are unchanged:
# an Artemis run that used the system picker does not rewrite pick-to-editor android.drive.
# Nodes are screens / overlays / sheets / dialogs. Editor tabs (Content / Style / Layout)
# and layout class (compact / medium / expanded / wide) are states of `editor`, not nodes.
# Drive labels: real | seam | none. System picker cells, FileDialog, share sheets, and
# permission prompts are never claimed as real.
# screens_ref is a one-way back-link to docs/parity/v2.10.0/inventory/screens.md (frozen).

nodes:
  - id: system
    source: app/src/main/java/me/rosuh/easywatermark/ui/MainActivity.kt
    states: []
  - id: launch
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/LaunchScreen.kt
    states:
      - idle
    screens_ref:
      - launch-idle
      - launch-about-entry
      - launch-gallery-entry
  - id: editor
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/EditorScreen.kt
    states:
      - content
      - style
      - layout
      - compact
      - medium
      - expanded
      - wide
    screens_ref:
      - editor-text-mode
      - editor-image-mode
      - editor-option-text
      - editor-option-degree
      - editor-option-tile-repeat
      - editor-option-tile-single
      - editor-option-alpha
      - editor-option-color
      - editor-option-size
      - editor-option-gaps
      - editor-option-typeface
      - editor-option-style
      - editor-photo-strip
      - editor-preview-pinch-or-scroll
  - id: about
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/about/AboutScreenShell.kt
    states:
      - root
    screens_ref:
      - about-root
      - about-dynamic-color
      - about-bounds
  - id: open_source
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/about/OpenSourceScreen.kt
    states:
      - open
    screens_ref:
      - about-open-source
  - id: gallery
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/GalleryDialogShell.kt
    states:
      - empty
      - populated
      - selected
      - dismiss
      - confirm
    screens_ref:
      - gallery-empty
      - gallery-populated
      - gallery-selected-n
      - gallery-dismiss
      - gallery-confirm
  - id: template_sheet
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/compose/TemplateListSheet.kt
    states:
      - list
      - edit
      - confirm-use
      - confirm-delete
    screens_ref:
      - editor-templates
  - id: text_edit_sheet
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/compose/TextContentOption.kt
    states:
      - open
    screens_ref:
      - editor-option-text
  - id: custom_color_sheet
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/compose/CustomColorPicker.kt
    states:
      - open
    screens_ref:
      - editor-option-color
  - id: save_export_sheet
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/save/SaveExportSheetShell.kt
    states:
      - open
      - exporting
      - done
      - failed
    screens_ref:
      - export-sheet-open
      - export-format-jpeg
      - export-format-png
      - export-quality
      - export-progress-k-of-n
      - export-done
      - export-failure
  - id: icon_picker
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/compose/IconWatermarkOption.kt
    states:
      - system-ui
  - id: add_more_picker
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/EditorTopBar.kt
    states:
      - system-ui
  - id: share_sheet
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/save/SaveExportSheetShell.kt
    states: []
    screens_ref:
      - export-share
  - id: crash_recovery
    source: shared/src/commonMain/kotlin/me/rosuh/easywatermark/ui/RecoveryScreen.kt
    states:
      - open
  - id: library_read_upsell
    source: shared/src/iosMain/kotlin/me/rosuh/easywatermark/ui/IosProductRootHost.kt
    states:
      - denied
      - limited
      - restricted

