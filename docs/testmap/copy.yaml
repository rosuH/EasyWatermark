cases:
  L1ProductUiTest.addMoreAppendsSecondImage:
    en: Add-more chrome appends a second photo
    zh: 点继续加图后相册多出第二张
  L1ProductUiTest.aboutOverlayRoundTrip:
    en: About opens from Launch and returns there
    zh: 从启动页打开关于，返回仍是启动页
