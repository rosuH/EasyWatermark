<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简单水印</title>
  <meta name="description" content="给照片铺上文字或图片水印，降低被盗用价值。完全离线，一次买断。">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <img src="icon.svg" width="40" height="40" alt="">
      <div class="brand">简单水印</div>
      <nav>
        <a href="/" hreflang="en">EN</a>
        <a href="zh-CN.html" aria-current="page">中文</a>
        <a href="privacy/zh-CN.html">隐私政策</a>
      </nav>
    </header>

    <h1>盖上用途。<br><em>照片还是你的。</em></h1>
    <p class="lede">
      给证件、原创和文件铺上文字或图片水印，降低被盗用、被滥用的价值。
      完全离线：无账号、无广告、无追踪。
    </p>
    <div class="actions">
      <a class="btn btn-solid" href="https://play.google.com/store/apps/details?id=me.rosuh.easywatermark">Android 下载</a>
      <a class="btn btn-ghost" href="https://github.com/rosuH/EasyWatermark">GitHub</a>
    </div>

    <div class="grid">
      <section class="card">
        <h2>只在本机处理</h2>
        <p>选图、编辑、导出都在设备上完成。导出去掉 EXIF，不会上传。</p>
      </section>
      <section class="card">
        <h2>一次买断</h2>
        <p>商店售价 USD $3.99。无订阅、无内购，App 里没有付费墙。</p>
      </section>
      <section class="card">
        <h2>iPhone 和 iPad</h2>
        <p>仅竖屏。iPad 为双栏编辑器。</p>
      </section>
    </div>

    <footer>
      <span>© 2026 rosuH</span>
      <a href="privacy/zh-CN.html">隐私政策</a>
      <a href="https://github.com/rosuH/EasyWatermark/issues/new">支持</a>
    </footer>
  </div>
</body>
</html>
